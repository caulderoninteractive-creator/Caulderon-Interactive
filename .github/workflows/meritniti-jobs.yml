name: MeritNiti official job discovery
on:
  schedule:
    - cron: '20 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover official leads without overwriting published jobs
        run: python tools/refresh_jobs.py --discover-only
      - name: Save lead report
        run: |
          git config user.name 'MeritNiti jobs bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/discovery_report.json
          if ! git diff --cached --quiet; then git commit -m 'Refresh MeritNiti official leads'; git push; fi
